version: "0.5"

processes:
  caddy:
    command: caddy run --config ./caddy/Caddyfile
  clients:
    command: cd ../../clients/spas && npm run dev
  identity:
    command: cd ../../services/identity && npm run start
  notes:
    command: cd ../../services/notes/notes-service && npm run start
  prometheus:
    command: prometheus --config.file=./prometheus/prometheus.yml --storage.tsdb.path=/tmp/prometheus
  grafana:
    command: sh -c 'GRAFANA_BIN=$(which grafana); GRAFANA_STORE=$(dirname $(dirname "$GRAFANA_BIN")); grafana server --homepath="$GRAFANA_STORE/share/grafana"'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      
      # Safe to clean up these
      - GF_PATHS_DATA=/tmp/grafana
      - GF_PATHS_LOGS=/tmp/grafana/logs
      - GF_PATHS_PLUGINS=/tmp/grafana/plugins
      
      # Provisioning configs (dashboards, datasources) - persist locally
      - GF_PATHS_PROVISIONING=./grafana/provisioning
  # loki:
  #   command: loki -config.file=./loki-config.yaml
