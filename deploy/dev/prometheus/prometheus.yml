global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["$PROMETHEUS_HOST"]

  - job_name: "loki"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["$LOKI_HOSTNAME:$LOKI_PORT"]

  - job_name: "caddy"
    static_configs:
      - targets: ["localhost:2020"]

  - job_name: "identity"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["$IDENTITY_SERVICE_HTTP_HOST"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["$NODE_EXPORTER_HOST"]
